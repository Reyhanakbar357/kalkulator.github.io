<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kalkulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="kontainer-kalkulator">
        <div class="tampilan-angka">
            <input type="text" class="tempat-input" value="0" disabled>
        </div>
        <div class="isi-kalkulator">
            <button class="AC" value="AC">AC</button>
            <button class="delete" value="←">←</button>
            <button class="operator" value="%">%</button>
            <button class="operator" value="/">&divide;</button>
            <button class="nilai" value="7">7</button>
            <button class="nilai" value="8">8</button>
            <button class="nilai" value="9">9</button>
            <button class="operator" value="*">&times;</button>
            <button class="nilai" value="4">4</button>
            <button class="nilai" value="5">5</button>
            <button class="nilai" value="6">6</button>
            <button class="operator" value="-">-</button>
            <button class="nilai" value="1">1</button>
            <button class="nilai" value="2">2</button>
            <button class="nilai" value="3">3</button>
            <button class="operator" value="+">+</button>
            <button class="koma" value=",">,</button>
            <button class="Nol" value="0">0</button>
            <button class="hasil" value="=">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
